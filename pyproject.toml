[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
source = ["symcirc"]
omit = ["tests/*", "tests/**"]

[tool.coverage.report]
omit = ["tests/*", "tests/**"]

[tool.pytest.ini_options]
addopts = ["-n 8"]
log_file = "pytest.log"
log_file_level = "INFO"